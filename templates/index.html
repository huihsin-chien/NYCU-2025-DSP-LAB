<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>樹莓派 MPU6050 警報控制台</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .control-panel, .log-panel { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        .log-panel { max-height: 400px; overflow-y: scroll; }
        h2 { border-bottom: 2px solid #eee; padding-bottom: 5px; }
        .status { margin-top: 10px; padding: 8px; background-color: #f0f0f0; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Raspberry Pi 警報控制台</h1>

        <div class="control-panel">
            <h2>控制設定</h2>
            <form id="settingsForm">
                <p>
                    <label for="pattern">燈光模式 (目前: <b>{{ current_pattern }}</b>):</label>
                    <select name="pattern" id="pattern">
                        <option value="Solid Red">靜態紅燈 (Solid Red)</option>
                        <option value="Flash Blue">偵測到警報時藍色閃爍 (Flash Blue)</option>
                        <option value="Off">關閉 (Off)</option>
                    </select>
                </p>

                <p>
                    <label for="mp3_file">MP3 檔案名稱 (目前: <b>{{ current_mp3 }}</b>):</label>
                    <input type="text" name="mp3_file" id="mp3_file" value="{{ current_mp3 }}" placeholder="例如: alert.mp3">
                </p>

                <p>
                    <input type="checkbox" id="music_switch" name="music_switch" {% if is_music_enabled %}checked{% endif %}>
                    <label for="music_switch">啟用警報音樂播放</label>
                </p>

                <button type="submit">更新設定</button>
                <div class="status" id="statusMessage"></div>
            </form>
        </div>

        <div class="log-panel">
            <h2>警報時間戳記日誌 (超過 $ {{ '%.2f'|format(ACCEL_THRESHOLD) }}g $)</h2>
            <ul id="logList">
                {% for log_time, log_accel in logs %}
                <li><b>{{ log_time }}</b> - 加速度: {{ log_accel }}</li>
                {% endfor %}
            </ul>
        </div>
    </div>

    <script>
        // JavaScript 用於處理表單提交和自動更新日誌

        document.getElementById('settingsForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = {
                pattern: formData.get('pattern'),
                mp3_file: formData.get('mp3_file'),
                // 如果 checkbox 沒勾選，它不會出現在 formData.get()，所以要手動檢查
                music_switch: document.getElementById('music_switch').checked ? 'on' : 'off'
            };

            fetch('/update_settings', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams(data)
            })
            .then(response => response.json())
            .then(data => {
                const statusDiv = document.getElementById('statusMessage');
                statusDiv.textContent = data.message;
                statusDiv.style.backgroundColor = '#d4edda';
                setTimeout(() => statusDiv.textContent = '', 3000);
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('statusMessage').textContent = '更新失敗!';
                document.getElementById('statusMessage').style.backgroundColor = '#f8d7da';
            });
        });

        // 定期更新日誌
        function fetchLogs() {
            fetch('/logs')
                .then(response => response.json())
                .then(logs => {
                    const logList = document.getElementById('logList');
                    logList.innerHTML = '';
                    logs.forEach(([log_time, log_accel]) => {
                        const li = document.createElement('li');
                        li.innerHTML = `<b>${log_time}</b> - 加速度: ${log_accel}`;
                        logList.appendChild(li);
                    });
                })
                .catch(error => console.error('Error fetching logs:', error));
        }

        // 每 3 秒更新一次日誌
        setInterval(fetchLogs, 3000); 

    </script>
</body>
</html>
